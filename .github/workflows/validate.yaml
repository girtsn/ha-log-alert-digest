name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python sources
        run: python -m compileall -q custom_components tests
      - name: Run error digest tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate manifest, HACS metadata and release notes
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/log_error_digest/manifest.json >/dev/null
          python - <<'PY'
          import json, re
          from pathlib import Path
          manifest = json.loads(Path("custom_components/log_error_digest/manifest.json").read_text())
          version = manifest["version"]
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), version
          assert manifest["domain"] == "log_error_digest"
          assert manifest["documentation"] == "https://github.com/girtsn/ha-log-alert-digest"
          assert Path(f"RELEASE_NOTES_{version}.md").is_file()
          PY

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # Temporarily ignore the manually configured GitHub repository topics.
          ignore: topics

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master
